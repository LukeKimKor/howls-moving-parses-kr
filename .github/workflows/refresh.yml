name: Refresh Data & Deploy

on:
  # Code/UI pushes deploy right away from the last snapshot (no provider API calls).
  # Docs-only pushes do not change the site and are skipped.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 10,16,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'characters / cache (no API) / patches (raid patch metadata only)'
        type: choice
        options: [characters, cache, patches]
        default: characters
        required: true
      force_refresh:
        description: 'Ignore application cache TTL; server cooldown and point budget still apply'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_BASE_PATH: ${{ vars.DEPLOY_BASE_PATH || format('/{0}/', github.event.repository.name) }}

jobs:
  build-and-deploy:
    # Both flags default to disabled. Enable only after the owner approves setup.
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so a push can be diffed against its previous head.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Restore previous public snapshot cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/last-snapshot.json
            cache/wcl-runtime.json
            cache/wcl-query-cache.json
          key: public-snapshot-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-snapshot-v1-${{ github.ref_name }}-

      - name: Restore newest previous published data
        run: pnpm tsx scripts/restore-snapshot.ts
        env:
          PREVIOUS_SITE_URL: https://${{ github.repository_owner }}.github.io${{ env.DEPLOY_BASE_PATH }}

      # Runs after the restore steps so a push can check the restored snapshot.
      - name: Select refresh scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Exit 0 when every configured character is in the restored snapshot.
          snapshot_has_all_characters() {
            node -e '
              const fs = require("node:fs");
              const config = JSON.parse(fs.readFileSync("characters.config.json", "utf8"));
              const snapshot = JSON.parse(fs.readFileSync("cache/last-snapshot.json", "utf8"));
              const names = new Set(snapshot.characters.map((c) => c.name));
              const missing = config.characters.filter((c) => !names.has(c.name)).map((c) => c.name);
              if (missing.length) console.log(`Not in last snapshot: ${missing.join(", ")}`);
              process.exit(missing.length ? 1 : 0);
            ' 2>/dev/null
          }
          case "$EVENT" in
            workflow_dispatch) scope="$INPUT_MODE" ;;
            schedule) scope=characters ;;
            push)
              # A cache build cannot fill in new or renamed characters, so fetch
              # data when the character config changed in this push, the previous
              # head is unknown, or a configured character has never been collected.
              if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null ||
                [ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- characters.config.json)" ] ||
                ! snapshot_has_all_characters; then
                scope=characters
              else
                scope=cache
              fi ;;
            *) echo "Unsupported event: $EVENT" >&2; exit 1 ;;
          esac
          echo "Refresh scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Fetch data
        run: pnpm fetch:refresh
        env:
          REFRESH_SCOPE: ${{ steps.scope.outputs.scope }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          SCHEDULED_REFRESH_ENABLED: ${{ vars.ENABLE_SCHEDULED_REFRESH }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_CURRENT_RAID_ZONE_ID: ${{ secrets.WCL_CURRENT_RAID_ZONE_ID }}
          WCL_CURRENT_RAID_HINT: ${{ secrets.WCL_CURRENT_RAID_HINT }}
          WCL_CURRENT_MPLUS_HINT: ${{ secrets.WCL_CURRENT_MPLUS_HINT }}

      - name: Validate snapshot
        run: pnpm test:snapshot

      - name: Save snapshot for the next refresh
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/last-snapshot.json
            cache/wcl-runtime.json
            cache/wcl-query-cache.json
          key: public-snapshot-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        if: github.event_name != 'schedule'
        run: |
          pnpm vite preview --port 3000 &
          SERVER_PID=$!
          sleep 3

          scores=()
          for i in 1 2 3; do
            pnpm dlx lighthouse "http://localhost:3000${DEPLOY_BASE_PATH}" \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path=lighthouse-report-$i.json \
              --quiet
            score=$(node -e "const r=require('./lighthouse-report-$i.json'); console.log(Math.round(r.categories.performance.score*100))")
            echo "Run $i performance: $score"
            scores+=($score)
          done

          kill $SERVER_PID

          node -e "
            const reports = [1,2,3].map(i => require('./lighthouse-report-' + i + '.json'));
            const avg = key => Math.round(reports.reduce((s, r) => s + r.categories[key].score * 100, 0) / reports.length);
            const scores = {
              performance: avg('performance'),
              accessibility: avg('accessibility'),
              'best-practices': avg('best-practices'),
              seo: avg('seo'),
            };
            console.log('Lighthouse scores (avg of 3):', scores);
            // SEO intentionally excluded — site uses noindex/nofollow (private dashboard)
            // Accessibility 95: dynamic Raider.IO score colours vary; 95 is the reliable floor
            const thresholds = { performance: 90, accessibility: 95, 'best-practices': 100 };
            const failures = Object.entries(thresholds).filter(([k, t]) => scores[k] < t);
            if (failures.length) {
              console.error('FAILED:', failures.map(([k,t]) => k + '=' + scores[k] + ' (need ' + t + ')').join(', '));
              process.exit(1);
            }
            console.log('All thresholds met ✓');
          "

      - name: Upload Lighthouse reports
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report-*.json
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist/

  deploy:
    needs: build-and-deploy
    if: vars.ENABLE_PUBLIC_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
