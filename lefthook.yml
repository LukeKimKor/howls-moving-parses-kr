commit-msg:
  commands:
    conventional-commit:
      run: |
        MSG=$(cat "{1}")
        PATTERN='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\([a-z0-9-]+\))?: .+'
        if ! echo "$MSG" | grep -qE "$PATTERN"; then
          echo ""
          echo "  ✗ Commit message does not follow Conventional Commits format."
          echo ""
          echo "  Expected: <type>(<scope>): <description>"
          echo "  Example:  feat(leaderboard): add EU region filter"
          echo ""
          echo "  Valid types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
          echo ""
          exit 1
        fi

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,js}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}
